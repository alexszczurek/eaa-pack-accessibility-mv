<!-- kit: nav (plain HTML twin)
     Header landmark + mobile toggle reporting aria-expanded. -->
<style>
  .site-header { border-bottom: 1px solid #e4e4e7; background: #fff; font: 0.875rem/1.25 system-ui, sans-serif; }
  .site-header nav { max-width: 64rem; margin: 0 auto; padding: 0.75rem 1rem; display: flex; align-items: center; justify-content: space-between; }
  .site-header .brand { font-weight: 600; color: #18181b; text-decoration: none; }
  .site-header ul { display: flex; gap: 1.5rem; list-style: none; margin: 0; padding: 0; }
  .site-header ul a { color: #3f3f46; text-decoration: none; }
  .site-header ul a:hover { color: #09090b; }
  .site-header a:focus-visible, .site-header button:focus-visible { outline: 2px solid #2563eb; outline-offset: 2px; border-radius: 4px; }
  .menu-toggle { display: none; border: 1px solid #d4d4d8; background: #fff; border-radius: 0.5rem; padding: 0.5rem; cursor: pointer; }
  #mobile-menu { display: none; border-top: 1px solid #e4e4e7; padding: 0.5rem 1rem; margin: 0; list-style: none; }
  #mobile-menu a { display: block; padding: 0.625rem 0.5rem; color: #27272a; text-decoration: none; border-radius: 0.5rem; }
  #mobile-menu a:hover { background: #fafafa; }
  @media (max-width: 768px) {
    .site-header ul.desktop { display: none; }
    .menu-toggle { display: inline-flex; }
    #mobile-menu.open { display: block; }
  }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
</style>

<header class="site-header">
  <nav aria-label="Main">
    <a class="brand" href="/">Acme Store</a>
    <ul class="desktop">
      <li><a href="/shop">Shop</a></li>
      <li><a href="/support">Support</a></li>
      <li><a href="/cart">Cart (2)</a></li>
    </ul>
    <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="mobile-menu"
      onclick="const m=document.getElementById('mobile-menu');const open=m.classList.toggle('open');this.setAttribute('aria-expanded',String(open));">
      <span class="sr-only">Open menu</span>
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 18 18">
        <path d="M3 5h12M3 9h12M3 13h12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" fill="none"/>
      </svg>
    </button>
  </nav>
  <ul id="mobile-menu">
    <li><a href="/shop">Shop</a></li>
    <li><a href="/support">Support</a></li>
    <li><a href="/cart">Cart (2)</a></li>
  </ul>
</header>
