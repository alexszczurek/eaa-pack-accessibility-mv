<!-- kit: skip-link (plain HTML twin)
     Place the link as the FIRST element inside <body>. -->
<style>
  .skip-link {
    position: absolute;
    left: -9999px;
    top: 1rem;
  }
  .skip-link:focus {
    position: fixed;
    left: 1rem;
    z-index: 50;
    background: #18181b;
    color: #fff;
    padding: 0.625rem 1rem;
    border-radius: 0.5rem;
    font: 500 0.875rem/1.25 system-ui, sans-serif;
    text-decoration: none;
    outline: 2px solid #2563eb;
    outline-offset: 2px;
  }
</style>

<a class="skip-link" href="#main">Skip to main content</a>

<!-- …header and nav here… -->
<main id="main" tabindex="-1">
  <!-- page content -->
</main>
