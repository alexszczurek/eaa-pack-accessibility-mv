<!-- kit: statement-page (plain HTML twin)
     Full printable page for publishing an accessibility statement.
     Keep the <html lang> matching the statement language. -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Accessibility statement — Acme Store</title>
  <style>
    body { margin: 0; background: #fff; color: #18181b; font: 15px/1.7 system-ui, sans-serif; }
    .statement { max-width: 42rem; margin: 0 auto; padding: 3rem 1.5rem; }
    .statement header { border-bottom: 1px solid #e4e4e7; padding-bottom: 1.5rem; }
    .statement h1 { font-size: 1.5rem; margin: 0; letter-spacing: -0.01em; }
    .statement dl { margin: 1rem 0 0; font-size: 0.875rem; color: #52525c; }
    .statement dt { font-weight: 500; color: #18181b; display: inline; }
    .statement dd { display: inline; margin: 0 0 0 0.25rem; }
    .statement h2 { font-size: 1.125rem; margin: 2rem 0 0.5rem; }
    .statement a { color: #1d4ed8; text-decoration: underline; text-underline-offset: 4px; }
    .statement ul { padding-left: 1.25rem; }
  </style>
</head>
<body>
  <div class="statement">
    <header>
      <h1>Accessibility statement — Acme Store</h1>
      <dl>
        <div><dt>Last reviewed:</dt> <dd>2026-08-01</dd></div>
        <div><dt>Contact:</dt> <dd><a href="mailto:access@acme.com">access@acme.com</a></dd></div>
      </dl>
    </header>
    <main>
      <!-- Paste your generated statement content here -->
      <h2>What we do</h2>
      <ul>
        <li>Keyboard access across checkout</li>
        <li>Text alternatives for product images</li>
      </ul>
      <h2>Known limitations</h2>
      <p>…</p>
    </main>
  </div>
</body>
</html>
