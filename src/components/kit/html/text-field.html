<!-- kit: text-field (plain HTML twin)
     Label tied via for/id; hint and error tied via aria-describedby. -->
<style>
  .field { max-width: 24rem; font: 0.875rem/1.4 system-ui, sans-serif; }
  .field label { display: block; font-weight: 500; color: #18181b; margin-bottom: 0.375rem; }
  .field .hint { color: #52525c; margin: 0 0 0.375rem; }
  .field input {
    width: 100%;
    height: 2.5rem;
    padding: 0 0.75rem;
    border: 1px solid #d4d4d8;
    border-radius: 0.5rem;
    font: inherit;
    color: #18181b;
    box-sizing: border-box;
  }
  .field input:focus-visible { outline: 2px solid #2563eb; outline-offset: 2px; }
  .field input[aria-invalid="true"] { border-color: #b91c1c; }
  .field .error { color: #b91c1c; font-weight: 500; margin: 0.375rem 0 0; }
</style>

<div class="field">
  <label for="email">Email</label>
  <p class="hint" id="email-hint">We only use this for your receipt.</p>
  <input id="email" name="email" type="email" autocomplete="email"
         aria-describedby="email-hint email-error" aria-invalid="true" />
  <p class="error" id="email-error">Enter an email address with an @ sign.</p>
</div>
